<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Check Login|Pass Hotmail (2026. v1)</title>
  <!-- https://electronjs.org/docs/tutorial/security#csp-meta-tag -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="./css/bootstrap.css">
</head>

<body>
  <h1 class="title-app">Check Login|Pass Hotmail (2026. v1)</h1>
  <div id="thongbao" class="alert alert-success hidden" role="alert">
    Đã chạy xong file data
  </div>
  <div class="wr">
    <button id="start" type="button" class="button btn btn-primary">Start</button>
    <button id="pause" type="button" class="button btn btn-danger">Pause</button>
    <button id="result" class="button btn btn-info">Xuất kết quả</button>
    <div class="value">
      <input type="input" id="filepathmail" placeholder="Đường dẫn file mail">
      <input type="input" id="filepathproxy" placeholder="Đường dẫn file proxy">
      <input type="input" id="thread" placeholder="Số luồng">
    </div>
    <div class="value">
      <div class="total">
        <span>Time: </span>
        <span id="time">0s</span>
      </div>
    </div>
    <div class="value">
      <div class="valid">
        <span>Valid: </span>
        <span id="valid">0</span>
      </div>
      <div class="invalid">
        <span>Invalid: </span>
        <span id="invalid">0</span>
      </div>
      <div class="unchecked">
        <span>Unchecked: </span>
        <span id="unchecked">0</span>
      </div>
      <div class="total">
        <span>Total: </span>
        <span id="total">0</span>
      </div>
    </div>
  </div>
  <ul class="info">
    <li>file data format theo mail|pass</li>
  </ul>
  <script src="./renderer.js"></script>
</body>

</html>
