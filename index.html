<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Change Pass Hotmail (2026. v1)</title>
  <!-- https://electronjs.org/docs/tutorial/security#csp-meta-tag -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="./css/bootstrap.css">
</head>

<body>
  <h1 class="title-app">Change Pass Hotmail (2026. v1)</h1>
  <div id="thongbao" class="alert alert-success hidden" role="alert">
    Đã chạy xong file data
  </div>
  <div class="wr">
    <button id="start" type="button" class="button btn btn-primary">Start</button>
    <button id="pause" type="button" class="button btn btn-danger">Pause</button>
    <button id="result" class="button btn btn-info">Xuất kết quả</button>
    <div class="value">
      <input type="input" id="filepathmail" placeholder="Đường dẫn file mail" value="/Users/taiphan/Desktop/ToolHotmail/data/data.txt">
      <input type="input" id="filepathproxy" placeholder="Đường dẫn file proxy" value="/Users/taiphan/Desktop/ToolHotmail/data/proxy.txt">
      <input type="input" id="thread" placeholder="Số luồng">
    </div>
    <div class="value">
      <div class="total">
        <span>Time: </span>
        <span id="time">0s</span>
      </div>
    </div>
    <div class="value result-summary">
      <div class="result-card changed-pass">
        <span class="result-label">Changed Pass</span>
        <span id="changed-pass" class="result-count">0</span>
      </div>
      <div class="result-card login-ok">
        <span class="result-label">Login OK</span>
        <span id="login-ok" class="result-count">0</span>
      </div>
      <div class="result-card failed">
        <span class="result-label">Failed</span>
        <span id="failed" class="result-count">0</span>
      </div>
      <div class="result-card total-result">
        <span class="result-label">Total</span>
        <span id="total" class="result-count">0</span>
      </div>
    </div>
  </div>
  <ul class="info">
    <li>file data format theo mail|pass|mailkhophuc</li>
  </ul>
  <script src="./renderer.js"></script>
</body>

</html>
